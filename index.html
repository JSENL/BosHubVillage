<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>HubVillage - Connect with Your Community</title>
    <meta name="description" content="HubVillage connects neighbors through local events, businesses, culture, and community resources. Discover what's happening in your neighborhood." />
    <meta name="keywords" content="local events, community, businesses, services, neighborhood, discover, HubVillage" />
    <meta name="author" content="HubVillage" />
    
    <!-- Mobile Web App Capable -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HubVillage" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="canonical" href="https://hubvillage.app/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hubvillage.app/" />
    <meta property="og:title" content="Local Community Hub - Discover Events, Businesses & Services" />
    <meta property="og:description" content="Discover local events, businesses, and community services in your area. Connect with your neighborhood and explore what's happening around you." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Local Community Hub" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://your-domain.com/" />
    <meta name="twitter:title" content="Local Community Hub - Discover Events, Businesses & Services" />
    <meta name="twitter:description" content="Discover local events, businesses, and community services in your area. Connect with your neighborhood and explore what's happening around you." />
    <meta name="twitter:image" content="/og-image.jpg" />
    
    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.mapbox.com" />
    <link rel="dns-prefetch" href="https://mecotkulcgdbilaksddu.supabase.co" />
    
    <!-- Theme and Icons -->
    <meta name="theme-color" content="#3b82f6" />
    <meta name="msapplication-TileColor" content="#3b82f6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Local Community Hub",
      "description": "Discover local events, businesses, and community services in your area",
      "url": "https://hubvillage.app",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://hubvillage.app/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <!-- Accessibility: Skip to main content -->
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-blue-600 text-white px-4 py-2 rounded z-50">
      Skip to main content
    </a>
    
    <div id="root"><!--ssr-outlet--></div>
    
    <!-- Performance: Critical scripts -->
    <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/entry-client.tsx"></script>
    
  </body>
</html>
